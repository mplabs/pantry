openapi: 3.1.0
info:
  title: Pantry OS API
  version: 0.1.0
  description: API contract for the Pantry OS web backend and future Swift (iOS/macOS) client.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          description: Zod flatten() output, present on 400 validation errors.
          additionalProperties: true
      required: [error]
    UserRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: [string, 'null']
        email:
          type: string
      required: [id, email]
    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        - type: object
          properties:
            preferredLocales:
              type: string
              description: Comma-separated locale list, e.g. "en,de".
          required: [preferredLocales]
    PantryCategory:
      type: string
      enum: [DAIRY, PRODUCE, MEAT, FROZEN, CANNED, GRAINS, LEGUMES, SPICES, BEVERAGES, BAKING, SNACKS, OTHER]
    FreshnessStatus:
      type: string
      enum: [fresh, expiring, expired]
    LocalizedTerm:
      type: object
      properties:
        locale:
          type: string
        text:
          type: string
      required: [locale, text]
    Invite:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [token, expiresAt]
    HouseholdInviteSummary:
      type: object
      description: Open (unaccepted, unexpired) invite as embedded in GET /api/households.
      properties:
        id:
          type: string
        token:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
      required: [id, token, createdAt, expiresAt, createdByUserId]
    HouseholdRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required: [id, name]
    ResolvedIngredient:
      type: object
      properties:
        input:
          type: string
        canonical:
          type: string
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedTerm'
      required: [input, canonical, aliases]
    Product:
      type: object
      properties:
        barcode:
          type: string
        source:
          type: string
        productName:
          type: string
        normalizedProductName:
          type: string
        brand:
          type: string
        quantityLabel:
          type: string
        imageUrl:
          type: string
        category:
          $ref: '#/components/schemas/PantryCategory'
        fromCache:
          type: boolean
      required: [barcode, source, productName, normalizedProductName, category, fromCache]
    HouseholdMember:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: [string, 'null']
            email:
              type: string
          required: [id, email]
      required: [id, role, user]
    Household:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        defaultLocale:
          type: string
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/HouseholdMember'
      required: [id, name, defaultLocale, memberships]
    PantryItemName:
      type: object
      properties:
        id:
          type: string
        itemId:
          type: string
        locale:
          type: string
        text:
          type: string
        normalizedText:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, itemId, locale, text, normalizedText, createdAt]
    PantryItem:
      type: object
      properties:
        id:
          type: string
        householdId:
          type: string
        addedByUserId:
          type: string
        barcode:
          type: [string, 'null']
        primaryName:
          type: string
        normalizedPrimaryName:
          type: string
        canonicalName:
          type: string
        quantity:
          type: number
        unit:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/PantryCategory'
        location:
          type: [string, 'null']
        purchaseDate:
          type: string
          format: date-time
        useByDate:
          type: [string, 'null']
          format: date-time
        shelfLifeDays:
          type: [integer, 'null']
        notes:
          type: [string, 'null']
        names:
          type: array
          items:
            $ref: '#/components/schemas/PantryItemName'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, householdId, addedByUserId, primaryName, normalizedPrimaryName, canonicalName, quantity, category, purchaseDate, names, createdAt, updatedAt]
    PantryItemWithStatus:
      description: Item as returned by the list endpoint, with derived freshness and addedByUser.
      allOf:
        - $ref: '#/components/schemas/PantryItem'
        - type: object
          properties:
            status:
              $ref: '#/components/schemas/FreshnessStatus'
            addedByUser:
              $ref: '#/components/schemas/UserRef'
          required: [status, addedByUser]
  responses:
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not a household member
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation error (invalid body or path parameter)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ItemNotFound:
      description: Item not found in household
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
  - sessionCookie: []
paths:
  /api/households:
    get:
      summary: List households for the signed-in user
      responses:
        '200':
          description: User households
          content:
            application/json:
              schema:
                type: object
                properties:
                  households:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Household'
                        - type: object
                          properties:
                            invites:
                              type: array
                              items:
                                $ref: '#/components/schemas/HouseholdInviteSummary'
                          required: [invites]
                  currentUser:
                    $ref: '#/components/schemas/CurrentUser'
                required: [households, currentUser]
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a household
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                defaultLocale:
                  type: string
              required: [name]
      responses:
        '201':
          description: Household created
          content:
            application/json:
              schema:
                type: object
                properties:
                  household:
                    $ref: '#/components/schemas/Household'
                required: [household]
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/households/{householdId}/items:
    get:
      summary: List inventory items for a household
      parameters:
        - in: path
          name: householdId
          required: true
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/FreshnessStatus'
      responses:
        '200':
          description: Item list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PantryItemWithStatus'
                required: [items]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create inventory item
      parameters:
        - in: path
          name: householdId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                barcode:
                  type: string
                quantity:
                  type: number
                unit:
                  type: string
                category:
                  $ref: '#/components/schemas/PantryCategory'
                location:
                  type: string
                purchaseDate:
                  type: string
                  format: date
                useByDate:
                  type: string
                  format: date
                shelfLifeDays:
                  type: integer
                notes:
                  type: string
                localizedNames:
                  type: object
                  additionalProperties:
                    type: string
              required: [name, quantity]
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/PantryItem'
                required: [item]
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/households/{householdId}/items/{itemId}:
    parameters:
      - in: path
        name: householdId
        required: true
        schema:
          type: string
      - in: path
        name: itemId
        required: true
        schema:
          type: string
    patch:
      summary: Update inventory item (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one field. Changing name or localizedNames re-derives canonical name and aliases.
              properties:
                name:
                  type: string
                quantity:
                  type: number
                unit:
                  type: [string, 'null']
                category:
                  $ref: '#/components/schemas/PantryCategory'
                location:
                  type: [string, 'null']
                useByDate:
                  type: [string, 'null']
                  format: date
                notes:
                  type: [string, 'null']
                localizedNames:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/PantryItem'
                required: [item]
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ItemNotFound'
    delete:
      summary: Delete inventory item
      responses:
        '204':
          description: Item deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ItemNotFound'
  /api/households/{householdId}/items/{itemId}/decrement:
    post:
      summary: Use up stock; the item is deleted when the amount reaches or exceeds the remaining quantity
      parameters:
        - in: path
          name: householdId
          required: true
          schema:
            type: string
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  exclusiveMinimum: 0
                  default: 1
      responses:
        '200':
          description: Item decremented, or removed when stock reached zero
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  item:
                    oneOf:
                      - $ref: '#/components/schemas/PantryItem'
                      - type: 'null'
                    description: Null when the item was deleted.
                required: [deleted, item]
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ItemNotFound'
  /api/households/{householdId}/invites:
    post:
      summary: Generate invite link for a household (OWNER/ADMIN only)
      parameters:
        - in: path
          name: householdId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Invite link generated (valid 7 days)
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite:
                    $ref: '#/components/schemas/Invite'
                  inviteUrl:
                    type: string
                    format: uri
                required: [invite, inviteUrl]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a household member, or role is not OWNER/ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/invites/accept:
    post:
      summary: Accept invite token and join household
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 10
                  maxLength: 256
              required: [token]
      responses:
        '200':
          description: Invite accepted; caller is now a MEMBER (idempotent if already one)
          content:
            application/json:
              schema:
                type: object
                properties:
                  household:
                    $ref: '#/components/schemas/HouseholdRef'
                required: [household]
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invite already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Invite expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited (10 requests per minute per user)
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/language/ingredients/resolve:
    post:
      summary: Normalize ingredient names to language-independent canonical keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ingredients:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
                    minLength: 1
                    maxLength: 120
              required: [ingredients]
      responses:
        '200':
          description: Resolved ingredient names and aliases
          content:
            application/json:
              schema:
                type: object
                properties:
                  normalized:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResolvedIngredient'
                  llmEnabled:
                    type: boolean
                required: [normalized, llmEnabled]
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/products/barcode/{barcode}:
    get:
      summary: Resolve a barcode to a known product record
      parameters:
        - in: path
          name: barcode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product resolved by barcode
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:
                    $ref: '#/components/schemas/Product'
                required: [product]
        '400':
          description: Invalid barcode (must be 8-14 digits)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
