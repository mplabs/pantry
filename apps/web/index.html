<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantry Inventory</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Pantry Inventory</h1>
      <p>Track what you have, what expires soon, and what to restock.</p>
    </header>

    <main class="layout">
      <section class="card">
        <h2>Add Item</h2>
        <form id="item-form">
          <label>
            Item name
            <input type="text" name="name" required />
          </label>

          <div class="row">
            <label>
              Quantity
              <input type="number" min="0" step="0.01" name="quantity" required />
            </label>
            <label>
              Unit
              <input type="text" name="unit" placeholder="pcs, oz, lb, jar" />
            </label>
          </div>

          <div class="row">
            <label>
              Category
              <input type="text" name="category" placeholder="Grains, Canned, Spices" />
            </label>
            <label>
              Location
              <input type="text" name="location" placeholder="Top shelf, Fridge, Freezer" />
            </label>
          </div>

          <div class="row">
            <label>
              Purchase date
              <input type="date" name="purchaseDate" />
            </label>
            <label>
              Use-by date
              <input type="date" name="useByDate" />
            </label>
          </div>

          <label>
            Shelf life (days, optional)
            <input type="number" min="1" step="1" name="shelfLifeDays" />
          </label>

          <button type="submit">Add to Pantry</button>
        </form>
      </section>

      <section class="card">
        <h2>Overview</h2>
        <div id="stats" class="stats"></div>

        <div class="filter-bar">
          <label>
            View
            <select id="status-filter">
              <option value="all">All</option>
              <option value="fresh">Fresh</option>
              <option value="expiring">Expiring Soon</option>
              <option value="expired">Expired</option>
            </select>
          </label>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Qty</th>
                <th>Category</th>
                <th>Use-by</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventory-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="empty-row-template">
      <tr>
        <td colspan="6" class="empty-cell">No items in this view.</td>
      </tr>
    </template>

    <script src="./app.js" type="module"></script>
  </body>
</html>
